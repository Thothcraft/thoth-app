name: Android CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=BRAIN_URL=https://web-production-d7d37.up.railway.app
      - uses: actions/upload-artifact@v4
        with:
          name: thothcraft-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
